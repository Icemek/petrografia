<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrografia – Fiszki & Atlas</title>
  <style>
    :root {
      --bg: #121417;
      --card: #1c2026;
      --card-inner: #14181e;
      --border: #2e343e;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 20px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 820px; transition: max-width 0.2s ease; }
    body.has-right-sidebar .container,
    body.has-left-sidebar .container { max-width: 1160px; }
    body.has-left-sidebar.has-right-sidebar .container { max-width: 1480px; }

    /* Zakładki główne */
    .nav-tabs {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .nav-tab {
      flex: 1; padding: 10px 16px; border-radius: 10px;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .nav-tab:hover { color: var(--text); border-color: var(--accent); }
    .nav-tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      background: var(--card); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .toolbar-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, button, input[type="text"] {
      background: #0d1117; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 12px; font-size: 14px;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.1); }
    label.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }

    /* Układ 3-kolumnowy: Lewy panel porównawczy + Fiszka + Prawy panel podpowiedzi */
    .quiz-layout {
      display: flex; gap: 16px; align-items: flex-start;
    }
    .quiz-main {
      flex: 1; min-width: 0;
    }

    .compare-sidebar,
    .hints-sidebar {
      width: 315px; flex-shrink: 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; position: sticky; top: 20px;
      max-height: calc(100vh - 40px); overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .compare-sidebar {
      border-color: rgba(239, 68, 68, 0.45);
    }
    .sidebar-header {
      display: flex; flex-direction: column; gap: 4px;
      border-bottom: 1px solid var(--border); padding-bottom: 10px;
    }
    .sidebar-title {
      font-size: 14px; font-weight: 700; color: var(--text);
    }
    .sidebar-subtitle {
      font-size: 12px; color: var(--muted);
    }
    .sidebar-chips {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .hint-chip {
      padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 500;
      background: #0d1117; color: var(--text); border: 1px solid var(--border);
      cursor: pointer; transition: 0.12s; text-align: left;
    }
    .hint-chip:hover {
      border-color: var(--accent); background: rgba(59, 130, 246, 0.15); color: #93c5fd;
    }
    .hint-chip.used {
      background: rgba(34, 197, 94, 0.12); color: #86efac; border-color: rgba(34, 197, 94, 0.3);
      text-decoration: line-through; opacity: 0.65;
    }
    .sidebar-empty {
      font-size: 13px; color: var(--muted); line-height: 1.4;
    }

    /* Karty w panelu porównawczym po lewej */
    .compare-block {
      background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .compare-block.correct { border-color: rgba(34, 197, 94, 0.45); }
    .compare-block.wrong { border-color: rgba(239, 68, 68, 0.45); }
    .compare-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .compare-label.correct { color: var(--ok); }
    .compare-label.wrong { color: var(--err); }
    .compare-rock-name {
      font-size: 16px; font-weight: 700; color: var(--text);
    }
    .compare-img-wrap {
      width: 100%; height: 140px; background: #0d1117; border-radius: 6px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
    }
    .compare-img-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in;
    }
    .compare-section-title {
      font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px;
    }
    .compare-tags {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .compare-tags .tag {
      font-size: 11px; padding: 3px 8px;
    }

    @media (max-width: 960px) {
      .quiz-layout { flex-direction: column; }
      .compare-sidebar { width: 100%; position: static; max-height: none; }
      .hints-sidebar { display: none !important; }
      body.has-right-sidebar .container,
      body.has-left-sidebar .container,
      body.has-left-sidebar.has-right-sidebar .container { max-width: 820px; }
    }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; display: flex; flex-direction: column; gap: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card.card-ok {
      border-color: var(--ok);
      box-shadow: 0 0 28px 6px rgba(34, 197, 94, 0.35);
    }
    .card.card-err {
      border-color: var(--err);
      box-shadow: 0 0 28px 6px rgba(239, 68, 68, 0.35);
    }
    .card.card-warn {
      border-color: var(--warn);
      box-shadow: 0 0 24px 4px rgba(245, 158, 11, 0.3);
    }

    .header-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; gap: 8px; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .retry-pill {
      font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .badge {
      font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35);
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .badge.magmowe { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }
    .badge.okruchowe { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-color: rgba(245, 158, 11, 0.35); }
    .badge.chemiczne { background: rgba(6, 182, 212, 0.15); color: #67e8f9; border-color: rgba(6, 182, 212, 0.35); }
    .badge.organogeniczne { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); }
    .badge.metamorficzne { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.35); }

    .img-box {
      width: 100%; max-height: 380px; background: #0d1117; border-radius: 8px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); min-height: 220px;
    }
    .img-box img { width: 100%; max-height: 380px; object-fit: contain; display: block; cursor: zoom-in; }
    .img-fallback { color: var(--muted); padding: 30px; text-align: center; font-size: 14px; }

    .stage-box { display: flex; flex-direction: column; gap: 10px; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; font-size: 16px; padding: 10px 12px; transition: border-color 0.15s, box-shadow 0.15s; }
    input.flash-err { border-color: var(--err); box-shadow: 0 0 12px 2px rgba(239, 68, 68, 0.3); }
    input.flash-ok { border-color: var(--ok); box-shadow: 0 0 12px 2px rgba(34, 197, 94, 0.3); }

    .rock-title { font-size: 22px; font-weight: 700; color: var(--ok); margin: 0; }
    .category {
      background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s;
    }
    .category.active-cat {
      border-color: var(--accent);
    }
    .cat-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
    .cat-count { color: var(--muted); }
    .cat-count.done { color: var(--ok); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 500;
      background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .tag.missed {
      background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .tag.info {
      background: rgba(59, 130, 246, 0.14); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.32);
    }
    .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .hidden { display: none !important; }

    /* Atlas / Baza wiedzy */
    .atlas-controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      background: var(--card); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill-btn {
      padding: 6px 12px; border-radius: 999px; font-size: 13px;
      background: #0d1117; color: var(--muted); border: 1px solid var(--border);
    }
    .pill-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .atlas-search { flex: 1; min-width: 180px; }

    .atlas-list { display: flex; flex-direction: column; gap: 10px; }
    .atlas-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .atlas-summary {
      padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; user-select: none; list-style: none;
    }
    .atlas-summary:hover { background: rgba(255, 255, 255, 0.03); }
    .atlas-summary-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .atlas-rock-name { font-size: 17px; font-weight: 700; color: var(--text); }
    .atlas-meta { font-size: 13px; color: var(--muted); }
    .atlas-chevron { color: var(--muted); font-size: 13px; transition: transform 0.2s; }
    .atlas-item.open .atlas-chevron { transform: rotate(180deg); }

    .atlas-body {
      padding: 0 16px 16px 16px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 14px;
    }
    .atlas-cats {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px; margin-top: 14px;
    }
    .atlas-cat-box {
      background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .atlas-cat-title { font-size: 13px; font-weight: 600; color: var(--muted); }

    .atlas-gallery-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .atlas-gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px;
    }
    .atlas-thumb {
      position: relative; background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; aspect-ratio: 4 / 3; cursor: zoom-in;
      display: flex; align-items: center; justify-content: center;
    }
    .atlas-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.15s; }
    .atlas-thumb:hover img { transform: scale(1.04); }
    .atlas-thumb-err { font-size: 11px; color: var(--muted); padding: 6px; text-align: center; word-break: break-all; }

    /* Lightbox (powiększenie zdjęcia) */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; z-index: 9999; cursor: zoom-out;
    }
    .lightbox img {
      max-width: 94vw; max-height: 85vh; object-fit: contain; border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    .lightbox-caption { color: #e6edf3; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- GŁÓWNA NAWIGACJA -->
    <div class="nav-tabs">
      <button class="nav-tab active" id="tabQuiz">Fiszki (Nauka)</button>
      <button class="nav-tab" id="tabAtlas">Baza wiedzy (Atlas skał)</button>
    </div>

    <!-- WIDOK 1: FISZKI -->
    <div id="quizView">
      <div class="toolbar">
        <div class="toolbar-group">
          <select id="modeSelect">
            <option value="stage1" selected>Etap 1: Tylko nazwa (wszystkie zdjęcia)</option>
            <option value="both">Etap 1 + 2: Nazwa → Cechy (1 losowe/skałę)</option>
            <option value="stage2">Tylko Etap 2: Cechy (1 losowe/skałę)</option>
          </select>
          <select id="groupSelect">
            <option value="wszystkie" selected>Kategoria: Wszystkie (27)</option>
            <option value="magmowe">Magmowe (9)</option>
            <option value="okruchowe">Okruchowe (7)</option>
            <option value="chemiczne">Chemiczne (5)</option>
            <option value="organogeniczne">Organogeniczne i mieszane (3)</option>
            <option value="metamorficzne">Metamorficzne (3)</option>
          </select>
          <label class="toggle">
            <input type="checkbox" id="hintsToggle">
            Autouzupełnianie
          </label>
        </div>
        <div class="toolbar-group">
          <button id="shuffleBtn">Losuj nową talię</button>
        </div>
      </div>

      <div class="quiz-layout">
        <!-- LEWY PANEL PORÓWNAWCZY (GDY POMYLISZ SKAŁY) -->
        <aside class="compare-sidebar hidden" id="compareSidebar">
          <div class="sidebar-header">
            <div class="sidebar-title" style="color:#fca5a5;">Porównanie skał</div>
            <div class="sidebar-subtitle">Zestawienie poprawnej skały z Twoim typem</div>
          </div>
          <div id="compareContent" style="display:flex; flex-direction:column; gap:12px;"></div>
        </aside>

        <!-- ŚRODEK: KARTA FISZKI -->
        <div class="quiz-main">
          <div class="card" id="mainCard">
            <div class="header-row">
              <div class="header-left">
                <span id="progressText">Okaz 1 / 1</span>
                <span id="retryBadge" class="retry-pill hidden"></span>
              </div>
              <span id="statusText"></span>
            </div>

            <div class="img-box" id="imgBox"></div>

            <!-- ETAP 1 -->
            <div id="stage1Box" class="stage-box">
              <div class="input-row">
                <input type="text" id="nameInput" placeholder="Wpisz nazwę skały i naciśnij Enter..." autocomplete="off">
                <button class="primary" id="checkNameBtn">Sprawdź</button>
              </div>
            </div>

            <!-- ETAP 2 -->
            <div id="stage2Box" class="stage-box hidden">
              <h2 class="rock-title" id="revealedName"></h2>
              <div id="categoriesContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <div class="actions">
              <button id="revealBtn">Pokaż odpowiedź</button>
              <button class="primary" id="nextBtn">Następny →</button>
            </div>
          </div>
        </div>

        <!-- PRAWY PANEL Z PODPOWIEDZIAMI (DESKTOP) -->
        <aside class="hints-sidebar hidden" id="hintsSidebar">
          <div class="sidebar-header">
            <div class="sidebar-title" id="sidebarTitle">Możliwe odpowiedzi</div>
            <div class="sidebar-subtitle" id="sidebarSubtitle"></div>
          </div>
          <div class="sidebar-chips" id="sidebarChips"></div>
        </aside>
      </div>
    </div>

    <!-- WIDOK 2: ATLAS / BAZA WIEDZY -->
    <div id="atlasView" class="hidden">
      <div class="atlas-controls">
        <div class="pill-group" id="atlasGroupPills">
          <button class="pill-btn active" data-group="wszystkie">Wszystkie</button>
          <button class="pill-btn" data-group="magmowe">Magmowe</button>
          <button class="pill-btn" data-group="okruchowe">Okruchowe</button>
          <button class="pill-btn" data-group="chemiczne">Chemiczne</button>
          <button class="pill-btn" data-group="organogeniczne">Organogeniczne i mieszane</button>
          <button class="pill-btn" data-group="metamorficzne">Metamorficzne</button>
        </div>
        <input type="text" id="atlasSearch" class="atlas-search" placeholder="Szukaj skały...">
        <button id="toggleAllAtlasBtn">Rozwiń wszystkie</button>
      </div>
      <div class="atlas-list" id="atlasList"></div>
    </div>
  </div>

  <!-- Lightbox do powiększania zdjęć -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightboxImg" src="" alt="">
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

    function norm(str) {
      return str.trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/ł/g, "l");
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function isDesktop() {
      return window.matchMedia("(min-width: 961px)").matches;

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildCompareBlock(rockObj, labelText, cssType, preferredImg) {
      const imgs = Array.isArray(rockObj.zdjecia) ? rockObj.zdjecia : [];
      const imgSrc = preferredImg || (imgs.length > 0 ? imgs[Math.floor(Math.random() * imgs.length)] : "");

      const tekstura = (rockObj.kategorie && rockObj.kategorie["Tekstura"]) || [];
      const minGlowne = (rockObj.kategorie && (rockObj.kategorie["Minerały główne"] || rockObj.kategorie["Minerały"])) || [];
      const minDod = (rockObj.kategorie && rockObj.kategorie["Minerały dodatkowe"]) || [];
      const mineraly = [...minGlowne, ...minDod];

      const block = document.createElement("div");
      block.className = `compare-block ${cssType}`;

      const texTags = tekstura.length > 0
        ? tekstura.map(t => `<span class="tag info">${t}</span>`).join("")
        : `<span style="font-size:12px; color:var(--muted);">Brak danych</span>`;

      const minTags = mineraly.length > 0
        ? mineraly.map(m => `<span class="tag info">${m}</span>`).join("")
        : `<span style="font-size:12px; color:var(--muted);">Brak danych</span>`;

      block.innerHTML = `
        <div class="compare-label ${cssType}">${labelText}</div>
        <div class="compare-rock-name">${rockObj.nazwa}</div>
        <div class="compare-img-wrap">
          ${imgSrc ? `<img src="${imgSrc}" alt="${rockObj.nazwa}" title="Kliknij, aby powiększyć">` : `<span style="font-size:12px; color:var(--muted);">Brak zdjęcia</span>`}
        </div>
        <div class="compare-section-title">Tekstura</div>
        <div class="compare-tags">${texTags}</div>
        <div class="compare-section-title">Minerały</div>
        <div class="compare-tags">${minTags}</div>
      `;

      const imgEl = block.querySelector("img");
      if (imgEl) {
        imgEl.addEventListener("click", () => {
          openLightbox(imgSrc, `${rockObj.nazwa} (${labelText})`);
        });
      }

      return block;
    }

    function showCompareSidebar(correctRockCard, guessedRockObj) {
      const fullCorrectRock = BAZA_SKAL.find(r => norm(r.nazwa) === norm(correctRockCard.nazwa)) || correctRockCard;
      const correctImgs = Array.isArray(fullCorrectRock.zdjecia) ? fullCorrectRock.zdjecia : [];
      const otherImgs = correctImgs.filter(src => src !== correctRockCard.aktywneZdjecie);
      const refCorrectImg = otherImgs.length > 0
        ? otherImgs[Math.floor(Math.random() * otherImgs.length)]
        : correctRockCard.aktywneZdjecie;

      els.compareContent.innerHTML = "";
      els.compareContent.appendChild(
        buildCompareBlock(fullCorrectRock, "Poprawna odpowiedź", "correct", refCorrectImg)
      );
      els.compareContent.appendChild(
        buildCompareBlock(guessedRockObj, "Twoja odpowiedź", "wrong", null)
      );

      els.compareSidebar.classList.remove("hidden");
      document.body.classList.add("has-left-sidebar");
    }

    function enqueueWrongCard(card) {
      if (state.markedWrong) return;
      state.markedWrong = true;
      const alreadyQueued = wrongQueue.some(
        item => item.nazwa === card.nazwa && item.aktywneZdjecie === card.aktywneZdjecie
      );
      if (!alreadyQueued) {
        wrongQueue.push({ ...card });
      }
      updateRetryIndicator();
    }

    function updateRetryIndicator() {
      if (isRetryRound) {
        els.retryBadge.textContent = "Runda powtórkowa";
        els.retryBadge.classList.remove("hidden");
      } else if (wrongQueue.length > 0) {
        els.retryBadge.textContent = `Do powtórki: ${wrongQueue.length}`;
        els.retryBadge.classList.remove("hidden");
      } else {
        els.retryBadge.classList.add("hidden");
      }
    }

    function getFilteredRocks() {
      const g = els.group.value;
      if (g === "wszystkie") return BAZA_SKAL;
      return BAZA_SKAL.filter(r => r.grupa === g);
    }

    function buildDeck(shouldShuffle = false) {
      const mode = els.mode.value;
      const rocks = getFilteredRocks();
      const items = [];

      rocks.forEach(rock => {
        const imgs = Array.isArray(rock.zdjecia) && rock.zdjecia.length > 0
          ? rock.zdjecia
          : [rock.zdjecie || ""];

        if (mode === "stage1") {
          imgs.forEach(imgPath => {
            items.push({ nazwa: rock.nazwa, grupa: rock.grupa, aktywneZdjecie: imgPath, kategorie: rock.kategorie });
          });
        } else {
          const randomImg = imgs[Math.floor(Math.random() * imgs.length)];
          items.push({ nazwa: rock.nazwa, grupa: rock.grupa, aktywneZdjecie: randomImg, kategorie: rock.kategorie });
        }
      });

      deck = shouldShuffle ? shuffleArray(items) : items;
      wrongQueue = [];
      isRetryRound = false;
      currentIdx = 0;
    }

    function buildDatalists() {
      els.datalists.innerHTML = "";
      const rocks = getFilteredRocks();
      const names = [...new Set(rocks.map(r => r.nazwa))];
      createDatalist("dl-names", names);

      const pools = {};
      BAZA_SKAL.forEach(rock => {
        Object.entries(rock.kategorie || {}).forEach(([cat, vals]) => {
          if (!pools[cat]) pools[cat] = new Set();
          vals.forEach(v => pools[cat].add(v));
        });
      });

      categoryPools = {};
      Object.entries(pools).forEach(([cat, set]) => {
        const sorted = [...set].sort((a, b) => a.localeCompare(b, "pl"));
        categoryPools[cat] = sorted;
        createDatalist("dl-cat-" + norm(cat).replace(/[^a-z0-9]/g, ""), sorted);
      });
    }

    function createDatalist(id, items) {
      const dl = document.createElement("datalist");
      dl.id = id;
      items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item;
        dl.appendChild(opt);
      });
      els.datalists.appendChild(dl);
    }

    function updateHintsAttr() {
      const on = els.hints.checked;
      const useDatalist = on && !isDesktop();

      if (useDatalist) els.nameInput.setAttribute("list", "dl-names");
      else els.nameInput.removeAttribute("list");

      document.querySelectorAll(".cat-input").forEach(inp => {
        if (useDatalist) inp.setAttribute("list", inp.dataset.dl);
        else inp.removeAttribute("list");
      });

      updateSidebar();
    }

    function updateSidebar() {
      const on = els.hints.checked;
      document.body.classList.toggle("has-right-sidebar", on);
      els.hintsSidebar.classList.toggle("hidden", !on);

      if (!on || deck.length === 0) return;

      const mode = els.mode.value;
      const isStage2Active = mode === "stage2" || (mode === "both" && state.nameSolved);
      els.sidebarChips.innerHTML = "";

      if (!isStage2Active) {
        const rocks = getFilteredRocks();
        const names = [...new Set(rocks.map(r => r.nazwa))].sort((a, b) => a.localeCompare(b, "pl"));
        const groupLabel = els.group.value === "wszystkie" ? "Wszystkie grupy" : (NAZWY_GRUP[els.group.value] || els.group.value);

        els.sidebarTitle.textContent = `Skały (${groupLabel})`;
        els.sidebarSubtitle.textContent = `${names.length} możliwych nazw • kliknij lub wpisz`;

        names.forEach(name => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "hint-chip";
          btn.textContent = name;
          btn.addEventListener("click", () => {
            els.nameInput.value = name;
            els.nameInput.focus();
            checkName();
          });
          els.sidebarChips.appendChild(btn);
        });
      } else {
        const activeCat = state.activeCategory;
        if (!activeCat || !categoryPools[activeCat]) {
          els.sidebarTitle.textContent = "Podpowiedzi kategorii";
          els.sidebarSubtitle.textContent = "";
          els.sidebarChips.innerHTML = `<div class="sidebar-empty">Kliknij w pole dowolnej kategorii po lewej, aby wyświetlić wszystkie możliwe odpowiedzi z całej bazy.</div>`;
          return;
        }

        const pool = categoryPools[activeCat];
        const foundSet = state.found[activeCat] || new Set();
        const foundNorms = new Set([...foundSet].map(norm));

        els.sidebarTitle.textContent = activeCat;
        els.sidebarSubtitle.textContent = `Cała baza (${pool.length} haseł) • kliknij lub wpisz`;

        pool.forEach(item => {
          const btn = document.createElement("button");
          btn.type = "button";
          const alreadyFound = foundNorms.has(norm(item));
          btn.className = "hint-chip" + (alreadyFound ? " used" : "");
          btn.textContent = item;
          btn.addEventListener("click", () => {
            const box = [...document.querySelectorAll(".category")].find(b => b.dataset.cat === activeCat);
            if (!box) return;
            const inp = box.querySelector("input");
            if (inp && !inp.disabled) {
              inp.value = item;
              inp.focus();
              checkCategoryAnswer(deck[currentIdx], activeCat, inp, box);
            }
          });
          els.sidebarChips.appendChild(btn);
        });
      }
    }

    function setActiveCategory(catName) {
      state.activeCategory = catName;
      document.querySelectorAll(".category").forEach(box => {
        box.classList.toggle("active-cat", box.dataset.cat === catName);
      });
      updateSidebar();
    }

    function loadCard() {
      hideCompareSidebar();

      if (deck.length === 0) {
        els.progress.textContent = "Brak skał w tej kategorii";
        els.imgBox.innerHTML = `<div class="img-fallback">Brak skał w wybranej grupie.</div>`;
        updateSidebar();
        return;
      }

      const rock = deck[currentIdx];
      const mode = els.mode.value;
      const catKeys = Object.keys(rock.kategorie || {});
      state = {
        nameSolved: mode === "stage2",
        found: {},
        activeCategory: catKeys.length > 0 ? catKeys[0] : null,
        markedWrong: false
      };
      setCardState(null);
      updateRetryIndicator();

      const labelType = mode === "stage1" ? "Zdjęcie" : "Skała";
      const groupName = els.group.value === "wszystkie" ? "Wszystkie" : (NAZWY_GRUP[els.group.value] || els.group.value);
      els.progress.textContent = `${labelType} ${currentIdx + 1} / ${deck.length} • ${groupName}`;
      els.status.textContent = "";
      els.nameInput.value = "";
      els.nameInput.disabled = false;

      els.imgBox.innerHTML = "";
      const img = document.createElement("img");
      img.src = rock.aktywneZdjecie;
      img.alt = "Zdjęcie skały";
      img.title = "Kliknij, aby powiększyć";
      img.addEventListener("click", () => {
        const cap = state.nameSolved ? `${rock.nazwa} (${rock.aktywneZdjecie})` : "";
        openLightbox(rock.aktywneZdjecie, cap);
      });
      img.onerror = () => {
        els.imgBox.innerHTML = `<div class="img-fallback">Brak zdjęcia: <b>${rock.aktywneZdjecie}</b><br>Sprawdź nazwę pliku w folderze ze zdjęciami.</div>`;
      };
      els.imgBox.appendChild(img);

      els.stage1.classList.toggle("hidden", mode === "stage2");
      els.stage2.classList.toggle("hidden", mode !== "stage2");
      els.revealedName.textContent = rock.nazwa;

      renderCategories(rock);
      updateHintsAttr();

      if (mode !== "stage2") {
        els.nameInput.focus();
      } else {
        const firstCatInput = els.cats.querySelector("input");
        if (firstCatInput) firstCatInput.focus();
      }
    }

    function renderCategories(rock) {
      els.cats.innerHTML = "";
      const entries = Object.entries(rock.kategorie || {});
      entries.forEach(([catName, answers], idx) => {
        state.found[catName] = new Set();
        const dlId = "dl-cat-" + norm(catName).replace(/[^a-z0-9]/g, "");

        const box = document.createElement("div");
        box.className = "category" + (idx === 0 ? " active-cat" : "");
        box.dataset.cat = catName;

        box.innerHTML = `
          <div class="cat-header">
            <span>${catName}</span>
            <span class="cat-count">0 / ${answers.length}</span>
          </div>
          <div class="tags"></div>
          <div class="input-row">
            <input type="text" class="cat-input" data-dl="${dlId}" placeholder="Wpisz cechę (zalicza automatycznie)..." autocomplete="off">
          </div>
        `;

        const input = box.querySelector("input");
        input.addEventListener("focus", () => {
          setActiveCategory(catName);
        });
        box.addEventListener("click", (e) => {
          if (e.target !== input) {
            setActiveCategory(catName);
            if (!input.disabled) input.focus();
          }
        });
        input.addEventListener("input", () => {
          checkCategoryAnswer(rock, catName, input, box);
        });

        els.cats.appendChild(box);
      });
    }

    function checkCategoryAnswer(rock, catName, input, box) {
      const val = norm(input.value);
      if (!val) return;

      const answers = rock.kategorie[catName];
      const match = answers.find(a => norm(a) === val);

      if (match && !state.found[catName].has(match)) {
        state.found[catName].add(match);
        addTag(box.querySelector(".tags"), match, false);
        input.value = "";
        flash(input, "flash-ok");
        updateCatCounter(box, state.found[catName].size, answers.length);
        if (state.found[catName].size === answers.length) {
          input.disabled = true;
          input.placeholder = "Komplet!";
        }
        if (state.activeCategory === catName) {
          updateSidebar();
        }
      }
    }

    function addTag(container, text, missed) {
      const span = document.createElement("span");
      span.className = "tag" + (missed ? " missed" : "");
      span.textContent = (missed ? "• " : "✓ ") + text;
      container.appendChild(span);
    }

    function updateCatCounter(box, count, total) {
      const el = box.querySelector(".cat-count");
      el.textContent = `${count} / ${total}`;
      if (count === total) el.classList.add("done");
    }

    function goNextCard() {
      currentIdx++;
      if (currentIdx >= deck.length) {
        if (wrongQueue.length > 0) {
          deck = shuffleArray([...wrongQueue]);
          wrongQueue = [];
          isRetryRound = true;
          currentIdx = 0;
        } else {
          buildDeck(true);
        }
      }
      loadCard();
    }

    function checkName() {
      if (state.nameSolved && els.mode.value === "stage1") {
        goNextCard();
        return;
      }

      const rock = deck[currentIdx];
      const userNorm = norm(els.nameInput.value);
      const targetNorm = norm(rock.nazwa);

      if (!userNorm) return;

      // 1. Poprawna odpowiedź
      if (userNorm === targetNorm) {
        state.nameSolved = true;
        setCardState("ok");
        els.status.style.color = "var(--ok)";
        els.status.textContent = "Dobrze! (Enter → dalej)";

        if (els.mode.value === "both") {
          setCardState(null);
          els.stage1.classList.add("hidden");
          els.stage2.classList.remove("hidden");
          const firstCatInput = els.cats.querySelector("input");
          if (firstCatInput) firstCatInput.focus();
          updateSidebar();
        }
        return;
      }

      // 2. Sprawdź, czy wpisano inną istniejącą skałę z bazy (faktyczny błąd merytoryczny)
      const matchedOtherRock = BAZA_SKAL.find(r => norm(r.nazwa) === userNorm);
      if (matchedOtherRock) {
        setCardState("err");
        els.status.style.color = "#fca5a5";
        els.status.textContent = `To nie jest ${matchedOtherRock.nazwa}`;
        showCompareSidebar(rock, matchedOtherRock);
        enqueueWrongCard(rock);
        return;
      }

      // 3. Sprawdź, czy to zwykła literówka (blisko poprawnej nazwy, próg 1-2 znaki)
      const maxTypoDist = targetNorm.length <= 5 ? 1 : 2;
      const distToTarget = levenshtein(userNorm, targetNorm);
      if (distToTarget <= maxTypoDist) {
        setCardState("warn");
        els.status.style.color = "#fcd34d";
        els.status.textContent = "Literówka – popraw pisownię";
        return;
      }

      // 4. Zupełnie nieznane hasło spoza bazy – błąd, bez panelu porównania
      setCardState("err");
      els.status.style.color = "#fca5a5";
      els.status.textContent = "Niepoprawna nazwa";
      enqueueWrongCard(rock);
    }

    els.checkNameBtn.addEventListener("click", checkName);
    els.nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        checkName();
      }
    });

    els.revealBtn.addEventListener("click", () => {
      const rock = deck[currentIdx];
      if (!state.nameSolved) {
        enqueueWrongCard(rock);
        els.nameInput.value = rock.nazwa;
        state.nameSolved = true;
        setCardState("ok");
        els.status.style.color = "#fcd34d";
        els.status.textContent = "Odsłonięto (Enter → dalej)";
        els.nameInput.focus();
        if (els.mode.value === "both") {
          setCardState(null);
          els.stage1.classList.add("hidden");
          els.stage2.classList.remove("hidden");
          const firstCatInput = els.cats.querySelector("input");
          if (firstCatInput) firstCatInput.focus();
          updateSidebar();
        }
      } else {
        document.querySelectorAll(".category").forEach(box => {
          const catName = box.dataset.cat;
          const answers = rock.kategorie[catName];
          const tags = box.querySelector(".tags");
          answers.forEach(a => {
            if (!state.found[catName].has(a)) {
              state.found[catName].add(a);
              addTag(tags, a, true);
            }
          });
          updateCatCounter(box, answers.length, answers.length);
          const inp = box.querySelector("input");
          inp.disabled = true;
        });
        updateSidebar();
      }
    });

    els.nextBtn.addEventListener("click", goNextCard);

    els.shuffle.addEventListener("click", () => {
      buildDeck(true);
      loadCard();
    });

    els.mode.addEventListener("change", () => {
      buildDeck(true);
      loadCard();
    });

    els.group.addEventListener("change", () => {
      buildDatalists();
      buildDeck(true);
      loadCard();
    });

    els.hints.addEventListener("change", updateHintsAttr);
    window.addEventListener("resize", updateHintsAttr);

    // ===================== LOGIKA ATLASU (BAZA WIEDZY) =====================
    function renderAtlas() {
      const query = norm(els.atlasSearch.value);
      const filtered = BAZA_SKAL.filter(rock => {
        const matchGroup = atlasFilterGroup === "wszystkie" || rock.grupa === atlasFilterGroup;
        const matchQuery = !query || norm(rock.nazwa).includes(query);
        return matchGroup && matchQuery;
      });

      els.atlasList.innerHTML = "";

      if (filtered.length === 0) {
        els.atlasList.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Brak pasujących skał.</div>`;
        return;
      }

      filtered.forEach(rock => {
        const item = document.createElement("div");
        item.className = "atlas-item" + (atlasAllExpanded ? " open" : "");

        const imgs = Array.isArray(rock.zdjecia) ? rock.zdjecia : [];
        const catCount = Object.keys(rock.kategorie || {}).length;
        const groupLabel = NAZWY_GRUP[rock.grupa] || rock.grupa || "";

        const summary = document.createElement("div");
        summary.className = "atlas-summary";
        summary.innerHTML = `
          <div class="atlas-summary-left">
            <span class="atlas-rock-name">${rock.nazwa}</span>
            <span class="badge ${rock.grupa || ''}">${groupLabel}</span>
            <span class="atlas-meta">${imgs.length} zdjęć • ${catCount} kategorii</span>
          </div>
          <span class="atlas-chevron">▼</span>
        `;

        const body = document.createElement("div");
        body.className = "atlas-body" + (atlasAllExpanded ? "" : " hidden");

        const catsGrid = document.createElement("div");
        catsGrid.className = "atlas-cats";
        Object.entries(rock.kategorie || {}).forEach(([catName, answers]) => {
          const cBox = document.createElement("div");
          cBox.className = "atlas-cat-box";
          const tagsHtml = answers.map(a => `<span class="tag info">${a}</span>`).join("");
          cBox.innerHTML = `
            <div class="atlas-cat-title">${catName}</div>
            <div class="tags">${tagsHtml}</div>
          `;
          catsGrid.appendChild(cBox);
        });
        body.appendChild(catsGrid);

        const galWrapper = document.createElement("div");
        galWrapper.innerHTML = `<div class="atlas-gallery-title">Zdjęcia (${imgs.length}) – kliknij, aby powiększyć</div>`;
        const gal = document.createElement("div");
        gal.className = "atlas-gallery";

        imgs.forEach((src, i) => {
          const thumb = document.createElement("div");
          thumb.className = "atlas-thumb";
          const img = document.createElement("img");
          img.src = src;
          img.loading = "lazy";
          img.alt = `${rock.nazwa} ${i + 1}`;
          img.onerror = () => {
            thumb.innerHTML = `<div class="atlas-thumb-err">Brak:<br>${src}</div>`;
          };
          thumb.addEventListener("click", () => {
            openLightbox(src, `${rock.nazwa} (${i + 1} / ${imgs.length})`);
          });
          thumb.appendChild(img);
          gal.appendChild(thumb);
        });

        galWrapper.appendChild(gal);
        body.appendChild(galWrapper);

        summary.addEventListener("click", () => {
          const isOpen = item.classList.toggle("open");
          body.classList.toggle("hidden", !isOpen);
        });

        item.appendChild(summary);
        item.appendChild(body);
        els.atlasList.appendChild(item);
      });
    }

    els.atlasGroupPills.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      atlasFilterGroup = btn.dataset.group;
      els.atlasGroupPills.querySelectorAll(".pill-btn").forEach(b => b.classList.toggle("active", b === btn));
      renderAtlas();
    });

    els.atlasSearch.addEventListener("input", renderAtlas);

    els.toggleAllAtlasBtn.addEventListener("click", () => {
      atlasAllExpanded = !atlasAllExpanded;
      els.toggleAllAtlasBtn.textContent = atlasAllExpanded ? "Zwiń wszystkie" : "Rozwiń wszystkie";
      document.querySelectorAll(".atlas-item").forEach(item => {
        item.classList.toggle("open", atlasAllExpanded);
        item.querySelector(".atlas-body").classList.toggle("hidden", !atlasAllExpanded);
      });
    });

    // Inicjalizacja
    buildDatalists();
    buildDeck(true);
    loadCard();
  </script>
</body>
</html>
